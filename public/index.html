<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StrafeFlow</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background-color: #1e293b;
      padding: 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 1.5rem;
      color: #38bdf8;
    }

    .btn-discord {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: #5865F2;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-discord:hover {
      background-color: #4752C4;
      transform: translateY(-2px);
    }

    .user-card {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid #38bdf8;
    }

    .username {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .btn-logout {
      background-color: #ef4444;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      margin-top: 10px;
      transition: background-color 0.2s;
    }

    .btn-logout:hover {
      background-color: #dc2626;
    }

    .loading {
      color: #94a3b8;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>StrafeFlow</h1>

    <!-- Yükleniyor Durumu -->
    <div id="loading-state" class="loading">Kontrol ediliyor...</div>

    <!-- Giriş Yapılmamışsa Görünecek Buton -->
    <a id="discord-connect-btn" href="/api/auth/discord" class="btn-discord" style="display: none;">
      <svg width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
        <path d="M13.545 2.907a13.227 13.227 0 0 0-3.257-1.011.05.05 0 0 0-.052.025c-.141.25-.297.577-.406.833a12.19 12.19 0 0 0-3.658 0 8.258 8.258 0 0 0-.412-.833.051.051 0 0 0-.052-.025c-1.125.194-2.22.534-3.257 1.011a.041.041 0 0 0-.021.018C.356 6.024-.213 9.047.066 12.032c.001.014.01.028.021.037a13.276 13.276 0 0 0 3.995 2.02.05.05 0 0 0 .056-.019c.308-.42.582-.863.818-1.329a.05.05 0 0 0-.01-.059.051.051 0 0 0-.018-.011 8.875 8.875 0 0 1-1.248-.595.05.05 0 0 1-.02-.066.051.051 0 0 1 .015-.019c.084-.063.168-.129.248-.195a.05.05 0 0 1 .051-.007c2.619 1.196 5.454 1.196 8.041 0a.052.052 0 0 1 .053.007c.08.066.164.132.248.195a.05.05 0 0 1-.004.085 8.254 8.254 0 0 1-1.249.594.05.05 0 0 0-.03.07c.241.465.515.909.817 1.329a.05.05 0 0 0 .056.019 13.235 13.235 0 0 0 4.001-2.02.049.049 0 0 0 .021-.037c.334-3.451-.559-6.449-2.366-9.106a.034.034 0 0 0-.02-.019Zm-8.198 7.307c-.789 0-1.438-.724-1.438-1.612 0-.889.637-1.613 1.438-1.613.807 0 1.45.73 1.438 1.613 0 .888-.637 1.612-1.438 1.612Zm5.316 0c-.788 0-1.438-.724-1.438-1.612 0-.889.637-1.613 1.438-1.613.807 0 1.451.73 1.438 1.613 0 .888-.631 1.612-1.438 1.612Z"/>
      </svg>
      Discord ile Bağlan
    </a>

    <!-- Giriş Yapılmışsa Görünecek Profil Kartı -->
    <div id="user-card" class="user-card">
      <img id="user-avatar" class="avatar" src="" alt="Avatar">
      <div id="user-name" class="username"></div>
      <a href="/api/auth/logout" class="btn-logout">Çıkış Yap</a>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const loadingState = document.getElementById('loading-state');
      const connectBtn = document.getElementById('discord-connect-btn');
      const userCard = document.getElementById('user-card');
      const userAvatar = document.getElementById('user-avatar');
      const userName = document.getElementById('user-name');

      try {
        const res = await fetch('/api/me');
        const data = await res.json();

        loadingState.style.display = 'none';

        if (data.loggedIn) {
          // Kullanıcı giriş yapmış: Butonu gizle, profili göster
          userAvatar.src = data.user.avatar;
          userName.textContent = data.user.username;
          userCard.style.display = 'flex';
        } else {
          // Kullanıcı giriş yapmamış: Butonu göster
          connectBtn.style.display = 'inline-flex';
        }
      } catch (err) {
        console.error('Oturum kontrol hatası:', err);
        loadingState.textContent = 'Bir hata oluştu.';
      }
    });
  </script>
</body>
</html>
